<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>CodexBei</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand"><img class="logo" src="assets/brand/codexbei.svg" alt="" aria-hidden="true">CodexBei</div>
    <div class="toolbar-actions">
      <div id="theme" class="theme-switch" role="radiogroup" aria-label="外观主题">
        <label title="跟随系统"><input type="radio" name="appearance" value="system" aria-label="跟随系统" checked><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></label>
        <label title="石墨灰 · 深色"><input type="radio" name="appearance" value="dark" aria-label="石墨灰"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.5A8.5 8.5 0 0 1 9.5 3.8a8.5 8.5 0 1 0 10.7 10.7Z"/></svg></label>
        <label title="雾白 · 浅色"><input type="radio" name="appearance" value="light" aria-label="雾白"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></label>
      </div>
    <button id="website" class="text-button website">官网 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></button>
    </div>
  </header>
  <main>
    <div class="tabs" role="tablist" aria-label="选择工具">
      <button role="tab" aria-selected="true" aria-controls="codex-panel" id="codex-tab"><img class="agent-icon codex-icon" src="assets/agents/codex.svg" alt="" aria-hidden="true">Codex</button>
      <button role="tab" aria-selected="false" disabled><img class="agent-icon" src="assets/agents/claude-code.svg" alt="" aria-hidden="true">Claude Code <span>即将支持</span></button>
    </div>
    <section id="codex-panel" role="tabpanel" aria-labelledby="codex-tab">
      <div id="setup-view">
        <div class="page-heading"><h1>连接 Codex</h1><span id="config-state" class="state-badge" role="status">正在检查</span></div>
        <form id="configure">
          <div class="config-card">
            <div class="provider-row">
              <div class="provider-info"><h2>配置</h2></div>
            </div>
            <div class="credential-field">
              <div class="label-row"><label for="key">API 密钥</label><span id="imported" hidden>已自动填入</span></div>
              <div class="key-control">
                <input id="key" type="password" placeholder="粘贴密钥" autocomplete="off" spellcheck="false" aria-describedby="key-help" required>
                <div class="key-actions">
                  <button id="toggle-key" type="button" class="key-action" aria-label="显示密钥" title="显示密钥" aria-controls="key" aria-pressed="false" disabled><svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /> <circle cx="12" cy="12" r="3" /></svg><svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /> <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /> <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /> <path d="m2 2 20 20" /></svg></button>
                  <button id="clear-key" type="button" class="key-action" aria-label="清空输入的密钥" title="清空输入的密钥" aria-controls="key" disabled><svg class="icon-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button>
                </div>
              </div>
              <p id="key-help" class="field-help">使用你在 BeiAPI 创建的密钥。</p>
            </div>
            <p id="template-notice" class="notice" role="status" hidden></p>
            <div id="version-choice" hidden>
              <label for="installation">使用的 Codex</label>
              <select id="installation"><option value="auto">自动匹配</option></select>
              <div id="manual-version" hidden>
                <label for="codex-kind">版本类型</label>
                <select id="codex-kind"><option value="cli">Codex CLI</option><option value="desktop">Codex 桌面版</option></select>
                <label for="runtime-version">Codex 内核版本</label>
                <input id="runtime-version" placeholder="例如 0.153.4" maxlength="80" autocomplete="off">
                <label for="app-version">桌面版应用版本（可选）</label>
                <input id="app-version" placeholder="例如 26.901.51231" maxlength="80" autocomplete="off">
              </div>
            </div>
            <details id="settings">
              <summary><span class="summary-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>更多设置</span><span class="summary-hint">模型、版本与路径</span></summary>
              <div class="settings-body">
                <div class="version-row"><p id="version-info" class="connection"></p><button type="button" id="change-version" class="text-button" aria-controls="version-choice" aria-expanded="false">选择 Codex 版本</button></div>
                <div class="label-row model-label"><label for="model">模型</label><button type="button" id="refresh-models" class="text-button">刷新列表</button></div>
                <select id="model" required aria-describedby="models-help"><option value="gpt-6-astra">gpt-6-astra</option></select>
                <p id="models-help" class="field-help" role="status" hidden></p>
                <label for="base-url">API 地址</label>
                <input id="base-url" type="url" value="https://api.beiapi.cn/v1" required autocomplete="off" spellcheck="false">
                <label for="target">配置文件</label>
                <div class="path-row"><select id="target" required></select><button type="button" id="choose" class="secondary">更改</button></div>
                <button type="button" id="preview-button" class="text-button preview-button">查看配置改动</button>
                <div id="preview" hidden><pre id="preview-code" aria-label="配置改动预览"></pre></div>
              </div>
            </details>
            <div class="action-row"><button type="submit" id="apply" class="primary" disabled>一键配置</button></div>
          </div>
        </form>
      </div>
      <div id="success" hidden>
        <div class="success-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-8"/></svg></div>
        <span class="eyebrow">准备就绪</span>
        <h1 id="success-title" tabindex="-1">配置完成</h1>
        <p>重新打开 Codex，即可开始使用。</p>
        <button id="done" class="primary">完成</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <details id="history" class="history">
      <summary><span class="summary-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2 7M3 5v6h6m3-4v5l3 2"/></svg>还原配置</span><span class="summary-hint">查看历史备份</span></summary>
      <div id="backups"></div>
    </details>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
