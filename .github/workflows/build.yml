name: CodexBei Windows installers
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set up Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy --no-self-update
          rustup default 1.92.0
          rustup target add ${{ matrix.target }}
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: src-tauri/target
          key: rust-1.92-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}-nodebug-v1
          restore-keys: rust-1.92-${{ matrix.target }}-
      - run: npm run test:worker
      - name: Test diagnostics on Windows PowerShell 5.1
        shell: powershell
        run: ./test/windows-diagnostics.test.ps1
      - name: Test diagnostics on PowerShell 7
        shell: pwsh
        run: ./test/windows-diagnostics.test.ps1
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Clear cached installer bundles
        shell: pwsh
        run: |
          $bundlePath = 'src-tauri/target/${{ matrix.target }}/release/bundle'
          if (Test-Path -LiteralPath $bundlePath) {
            Remove-Item -LiteralPath $bundlePath -Recurse -Force
          }
      - name: Build Tauri NSIS installer
        # Only the updater signature is added locally after downloading artifacts.
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis --config src-tauri/tauri.windows-build.conf.json
      - name: Verify package without UI tests
        shell: pwsh
        run: ./scripts/test-windows-package.ps1 -Target '${{ matrix.target }}' -SkipUi
      - uses: actions/upload-artifact@v4
        with:
          name: CodexBei-windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            artifacts/windows-package-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
